apply from: "$rootDir/scripts/common.gradle"

android {
    namespace "com.yunuscagliyan.core"
}

dependencies {
    implementation Retrofit.okHttp
    implementation Retrofit.retrofit
    implementation Retrofit.okHttpLoggingInterceptor
    implementation Retrofit.moshiConverter
    // Adapters are resolved reflectively through KotlinJsonAdapterFactory (see
    // RetrofitModule): moshi-kotlin-codegen cannot parse Kotlin 2.x metadata.
    implementation Retrofit.moshiKotlin

    implementation Room.runtime
    kapt Room.compiler
    implementation Room.ktx
    implementation Admob.ump

    implementation Compose.pagingRuntime
    implementation Compose.pagingCompose
}
